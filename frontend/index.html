<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FashionAgent 电商 AI 客服自动化与辅助系统运营入口">
  <title>AI 客服运营台登录 · FashionAgent</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="brand-mark" aria-hidden="true">FA</div>
      <p class="eyebrow">AI SERVICE OPERATIONS</p>
      <h1 id="loginTitle">AI 客服运营台</h1>
      <p class="muted">运营商家知识、客服质量、人工接管与高风险审核。</p>
      <form id="merchantLoginForm" novalidate>
        <label for="username">商家员工账号</label>
        <input type="text" id="username" autocomplete="username" required>
        <label for="password">密码</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button class="button primary wide" id="loginBtn" type="submit">进入 AI 客服运营台</button>
      </form>
      <p class="form-error" id="loginError" role="alert"></p>
      <p class="security-note">消费者无需登录运营台，AI 客服通过商家现有渠道接入。</p>
      <a class="demo-preview-link" href="/demo-chat.html">查看客服会话演示 →</a>
    </section>
  </main>
  <script type="module" src="/js/merchant-login.js"></script>
</body>
</html>
