<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FashionAgent 客服演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; height: 100vh; display: flex; justify-content: center; align-items: center; }
  .chat { width: 480px; height: 680px; background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.08); display: flex; flex-direction: column; overflow: hidden; }
  .chat-header { padding: 16px 20px; border-bottom: 1px solid #e5e5ea; }
  .chat-header h1 { font-size: 16px; font-weight: 600; color: #1c1c1e; }
  .chat-header p { font-size: 12px; color: #8e8e93; margin-top: 2px; }
  .messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #007aff; color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: #f2f2f7; color: #1c1c1e; border-bottom-left-radius: 4px; }
  .msg .meta { font-size: 11px; color: #8e8e93; margin-top: 4px; }
  .msg.user .meta { color: rgba(255,255,255,.7); }
  .input-area { padding: 12px 16px; border-top: 1px solid #e5e5ea; display: flex; gap: 8px; background: #fff; }
  .input-area input { flex: 1; padding: 10px 14px; border: 1px solid #e5e5ea; border-radius: 20px; font-size: 14px; outline: none; }
  .input-area input:focus { border-color: #007aff; }
  .input-area button { padding: 10px 20px; background: #007aff; color: #fff; border: none; border-radius: 20px; font-size: 14px; cursor: pointer; }
  .input-area button:disabled { opacity: .5; cursor: not-allowed; }
  .loading { align-self: flex-start; color: #8e8e93; font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>
<div class="chat">
  <div class="chat-header">
    <h1>🧥 FashionAgent</h1>
    <p>服装电商智能客服 · 演示模式</p>
  </div>
  <div class="messages" id="messages">
    <div class="msg agent">
      您好！我是智能客服助手，可以帮您：<br>
      • 查询商品材质、洗护等信息<br>
      • 根据身高体重推荐尺码<br>
      • 查询订单状态和物流<br>
      • 查询商品库存<br>
      • 处理退款申请
      <div class="meta">FashionAgent · 演示</div>
    </div>
  </div>
  <div class="input-area">
    <input type="text" id="input" placeholder="输入您的问题..." autofocus>
    <button id="sendBtn">发送</button>
  </div>
</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

let sessionIdx = 0;

function addMessage(text, role, metaText) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  if (metaText) {
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = metaText;
    div.appendChild(meta);
  }
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function showLoading() {
  const div = document.createElement('div');
  div.className = 'loading';
  div.id = 'loading';
  div.textContent = '思考中...';
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function hideLoading() {
  const el = document.getElementById('loading');
  if (el) el.remove();
}

async function send() {
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  sendBtn.disabled = true;
  addMessage(text, 'user');

  showLoading();

  try {
    sessionIdx++;
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: `demo_${sessionIdx}`,
        user_id: 1,
        message: text
      })
    });
    const data = await res.json();
    hideLoading();
    const meta = `意图：${data.intent} · 置信度：${(data.confidence * 100).toFixed(0)}%`;
    addMessage(data.answer, 'agent', meta);
  } catch (err) {
    hideLoading();
    addMessage('请求失败，请确认服务是否运行。', 'agent');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
